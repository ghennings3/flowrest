name: Agente Autônomo de Testes (Gemini)

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node e Yarn
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "yarn"

      - name: Instalar Dependências
        run: yarn install --frozen-lockfile

      - name: Rodar o Agente
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx --yes tsx scripts/coverage-agent.ts

      - name: Commitar e Atualizar o PR
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "ai-test-agent"
            git config user.email "bot@seu-repo.com"
            git add .
            git commit -m "test: gerados e validados automaticamente pelo Agente Gemini"
            git push
          else
            echo "Nenhuma alteração de teste necessária ou gerada."
          fi
